name: Android release

# Push a tag like `android-v0.1.0` to build a signed AAB + APK and
# attach both to a GitHub release. Pattern carried over from
# reticulum-mobile-app's android-release.yml (same tag → versionCode
# scheme its build.gradle.kts already implements here).
#
# Required repo secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      (optional — falls back to store password)

on:
  push:
    tags:
      - 'android-v*'
  # Manual fallback: `gh workflow run android-release.yml --ref android-vX.Y.Z`
  # (the sibling repo once had GitHub drop a tag-push webhook).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release upload
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            chmod +x ./gradlew
          fi

      - name: Derive version from tag
        # Tag is the source of truth; build.gradle.kts reads the -P
        # properties (and can also read the tag itself for from-source
        # builds). versionCode = MA*10000 + MI*100 + PA.
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#android-v}"
          IFS='.' read -r MA MI PA <<< "$TAG"
          if ! [[ "$MA" =~ ^[0-9]+$ && "$MI" =~ ^[0-9]+$ && "$PA" =~ ^[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match android-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          CODE=$((MA*10000 + MI*100 + PA))
          echo "VERSION_NAME=$TAG"  >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Building $TAG (versionCode=$CODE)"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64 secret with the base64-encoded keystore."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Rename artifacts with version suffix
        # AGP emits `androidApp-release.{apk,aab}` regardless of version;
        # self-identifying names keep a tester's Downloads folder sane.
        run: |
          set -e
          APK_DIR="androidApp/build/outputs/apk/release"
          AAB_DIR="androidApp/build/outputs/bundle/release"
          NEW_APK="MeshCore-Android-${VERSION_NAME}-release.apk"
          NEW_AAB="MeshCore-Android-${VERSION_NAME}-release.aab"
          mv "$APK_DIR/androidApp-release.apk" "$APK_DIR/$NEW_APK"
          mv "$AAB_DIR/androidApp-release.aab" "$AAB_DIR/$NEW_AAB"
          echo "APK_NAME=$NEW_APK" >> "$GITHUB_ENV"
          echo "AAB_NAME=$NEW_AAB" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2
        with:
          name: MeshCore Android ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: |
            androidApp/build/outputs/apk/release/${{ env.APK_NAME }}
            androidApp/build/outputs/bundle/release/${{ env.AAB_NAME }}
