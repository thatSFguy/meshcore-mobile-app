name: iOS CI

# Builds the iOS app on a macOS runner and uploads an UNSIGNED .ipa.
#
# Why unsigned: distributing a signed build needs an Apple Developer
# account and provisioning profiles in secrets, and this is a personal
# project shared in the open. An unsigned .ipa is what sideloading tools
# (AltStore, Sideloadly) expect — they re-sign it with the user's own
# Apple ID on the way onto the device.
#
# This workflow is also the project's only iOS compiler: the app is
# developed on Linux, where nothing Apple can be built. Treat a red run
# here the way you would a local build error.
#
# Removed 2026-08-02 because macOS runner minutes bill at 10x on a
# PRIVATE repo. Restored 2026-08-06: the repo is public, where macOS
# runners are free. It was red when removed, and the cause was a
# JVM-only API (`toSortedMap`) that had reached commonMain — fixed, and
# now also guarded by SharedIsPlatformNeutralTest, which needs no runner
# but is a lint rather than a compiler. This is the compiler.

on:
  push:
    branches: [main]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      # Same 8.7 pin as android-ci.yml: 9.x removed an API that the KMP
      # iOS-target plumbing still uses.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '8.7'

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            chmod +x ./gradlew
          fi

      - name: Run shared tests (JVM)
        run: ./gradlew :shared:testDebugUnitTest

      # The real check. commonMain and commonTest compile for Native
      # here and nowhere else, so this is what actually catches a
      # JVM-only API reaching shared code — the defect that made this
      # workflow red before it was removed.
      - name: Run shared tests (Kotlin/Native, iOS simulator)
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Build the shared XCFramework
        run: ./gradlew :shared:assembleSharedXCFramework

      # XcodeGen emits the current project format (objectVersion 77),
      # which only Xcode 16+ can read — the macos-14 image's default
      # Xcode 15.4 fails with "future Xcode project file format".
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # CODE_SIGNING_ALLOWED=NO builds a .app with no signature at all,
      # which is exactly what the sideloading tools want to re-sign.
      - name: Build (unsigned, device SDK)
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      # An .ipa is a zip with the .app inside a top-level Payload/.
      - name: Package the unsigned IPA
        working-directory: iosApp
        run: |
          APP="build/Build/Products/Release-iphoneos/iosApp.app"
          test -d "$APP" || { echo "no .app produced at $APP"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MeshCoreHardened-iOS-unsigned.ipa Payload
          unzip -l MeshCoreHardened-iOS-unsigned.ipa | tail -3

      - name: Upload the unsigned IPA
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meshcore-hardened-ios-unsigned
          path: iosApp/MeshCoreHardened-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-logs
          path: |
            iosApp/build/Logs/
            shared/build/reports/
          if-no-files-found: ignore
