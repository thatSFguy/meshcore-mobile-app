name: Android CI

# Builds the debug APK + runs all unit tests on every push and pull
# request to main. The APK is uploaded as a workflow artifact so it can
# be sideloaded without tagging a release. Pattern carried over from
# reticulum-mobile-app's android-ci.yml (same toolchain pins).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this job only builds, tests, and uploads an
# artifact — it never writes repo contents (see the sibling repo's
# audit note M11: without this block a compromised Gradle plugin
# could push/tag with the default write-all token).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.7 pin: runner images ship Gradle 9.x which removed
      # `DefaultArtifactPublicationSet`, still referenced by AGP and the
      # KMP iOS-target plumbing — the bootstrap step crashes without the
      # pin (learned in the sibling repo).
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            chmod +x ./gradlew
          fi

      - name: Run shared module tests
        run: ./gradlew :shared:testDebugUnitTest

      - name: Run androidApp unit tests
        run: ./gradlew :androidApp:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: meshcore-mobile-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            androidApp/build/reports/tests/
          if-no-files-found: ignore
