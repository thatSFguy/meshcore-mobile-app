# XcodeGen spec for the MeshCore iOS app (same convention as the
# sibling reticulum-mobile-app: no checked-in .xcodeproj; regenerate).
#
# Bootstrap (macOS):
#   brew install xcodegen
#   ./gradlew :shared:assembleSharedXCFramework   # from the repo root
#   cd iosApp && xcodegen generate
#   open iosApp.xcodeproj

name: iosApp
options:
  bundleIdPrefix: io.github.thatsfguy.meshcore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: MeshCore
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          # Keep CBCentralManager attached while backgrounded so inbound
          # messages still notify. Pair with CoreBluetooth state
          # restoration before relying on this in production.
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: >-
          MeshCore uses Bluetooth Low Energy to talk to your MeshCore
          LoRa radio. Granting Bluetooth lets the app send and receive
          off-grid messages through the radio.
        NSCameraUsageDescription: >-
          MeshCore uses the camera to scan contact and community QR
          codes so you can add them without typing long hex strings.
    sources:
      - path: iosApp
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.thatsfguy.meshcore.ios
        FRAMEWORK_SEARCH_PATHS:
          - $(SRCROOT)/../shared/build/XCFrameworks/release
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        embed: false
        # Shared is built static (shared/build.gradle.kts isStatic=true):
        # symbols link into the app binary, nothing to embed.
